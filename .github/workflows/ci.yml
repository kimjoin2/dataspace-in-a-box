name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
      - run: go vet ./...
      # -race, not a bare `go test`. This project's entire concurrency story
      # is fire-and-forget push goroutines (DECISIONS.md §23.8) that outlive
      # the handler that spawned them, and nothing else in this pipeline would
      # notice one of them racing a state write. A bare run stayed green
      # through three tests that the detector fails outright.
      #
      # -count=2 because a race is an interleaving, not a state: a single run
      # samples one schedule and can miss it. Tests here already depend on
      # goroutine interleaving — the transfer driver's steps, the
      # counterparty-takes-over case — and the plan specifies -count=2 for the
      # local command, so a one-shot CI run was the weaker of the two gates.
      - run: go test -race -count=2 ./...

  tck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
      - name: Run the DSP TCK
        run: make tck
      # The connector log goes up alongside the TCK output because it is the
      # only record of what was actually on the wire — the TCK's own output
      # reports assertions, not message bodies. A TCK failure that reproduces
      # only in CI is exactly the case that needs both.
      - name: Upload TCK output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tck-output
          path: |
            tck-output.txt
            tck-connector.txt
