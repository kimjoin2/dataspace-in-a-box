name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26"
      - run: go vet ./...
      # -race, not a bare `go test`. This project's entire concurrency story
      # is fire-and-forget push goroutines (DECISIONS.md §23.8) that outlive
      # the handler that spawned them, and nothing else in this pipeline would
      # notice one of them racing a state write. A bare run stayed green
      # through three tests that the detector fails outright.
      #
      # -count=2 because a race is an interleaving, not a state: a single run
      # samples one schedule and can miss it. Tests here already depend on
      # goroutine interleaving — the transfer driver's steps, the
      # counterparty-takes-over case — and the plan specifies -count=2 for the
      # local command, so a one-shot CI run was the weaker of the two gates.
      - run: go test -race -count=2 ./...

  tck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26"
      - name: Run the DSP TCK
        run: make tck
      # The connector log goes up alongside the TCK output because it is the
      # only record of what was actually on the wire — the TCK's own output
      # reports assertions, not message bodies. A TCK failure that reproduces
      # only in CI is exactly the case that needs both.
      - name: Upload TCK output
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: tck-output
          path: |
            tck-output.txt
            tck-connector.txt

  # The demo is the only thing that exercises a transfer being interrupted and
  # resumed, and a Range request serving the remainder. No TCK suite sends or
  # asserts a byte, and the quickstart moves a file in one go, so before this
  # job that whole path was proven only when someone ran it by hand.
  #
  # ubuntu only: it is Compose, and GitHub's macOS runners have no Docker —
  # which is the same fact that makes the quickstart the artifact that runs
  # there instead.
  demo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26"
      - name: Move a file between two connectors, and resume an interrupted one
        run: make demo
      # run.sh's cleanup trap writes this on every exit path, so a failure
      # after the connectors are up leaves both their logs here — the only
      # record of what was on the wire. A failure before that leaves whatever
      # Compose had to say, which is still the thing to read.
      - name: Upload the demo log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: demo-log
          path: demo/demo.log
          if-no-files-found: ignore

  # The quickstart is the only artifact here that can run on a macOS runner:
  # the demo and the TCK are both Compose, and those runners have no Docker.
  # It is also the only one that needs to — the earlier harnesses keep the
  # host network out of the path by giving both connectors container names,
  # and a reader following docs/quickstart.md puts it squarely back in. The
  # address discovery, the listeners, and the loopback refusal are all
  # host-network behaviour, and this is where the two platforms can differ.
  quickstart:
    strategy:
      # Both legs run even when one fails: which platforms a change broke is
      # the whole question here, and cancelling the other leg hides half the
      # answer.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26"
      - name: Run the quickstart from the document
        run: make quickstart
      # The generated script and both connector logs, because a failure here
      # is read against all three: the script is what actually ran, and the
      # logs carry the reason a connector refused something — the management
      # API deliberately does not put that in its response.
      - name: Upload quickstart output
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: quickstart-output-${{ matrix.os }}
          path: |
            quickstart.sh
            quickstart-run/provider.log
            quickstart-run/consumer.log
          if-no-files-found: ignore
