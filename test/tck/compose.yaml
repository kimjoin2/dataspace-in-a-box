# The TCK and the connector talk to each other in both directions, so both run
# as services on one Compose network and address each other by service name.
# Running the connector on the host instead would behave differently on macOS
# and Linux.
services:
  dsbox:
    build:
      context: ../..
      dockerfile: Dockerfile
    environment:
      # The roster's signer is a freshly generated key every run (identities/
      # is gitignored — see run.sh), so it cannot live in the tracked
      # dsbox.yaml the way the file paths beside it do; only the value
      # changes, not where the connector looks for it.
      - DSBOX_ROSTER_SIGNER=${DSBOX_ROSTER_SIGNER}
      # The management token, for the same reason and by the same route: it is
      # the credential run.sh mints for the TCK, so it is a fresh value every
      # run and cannot live in dsbox.yaml either. That file deliberately sets
      # no mgmt_token, so if this passthrough is missing the connector starts
      # with none and rejects the first seeded agreement outright.
      - DSBOX_MGMT_TOKEN=${DSBOX_MGMT_TOKEN}
    volumes:
      - ./dsbox.yaml:/etc/dsbox/config.yaml:ro
      # Generated by run.sh before this service starts. The connector reads
      # the roster once at startup, so it has to exist by then.
      - ./identities/connector.key:/etc/dsbox/participant.key:ro
      - ./identities/roster.json:/etc/dsbox/roster.json:ro
    ports:
      # Management port. From the host, run.sh reaches it for the readiness
      # probe on /health and for the authenticated POST /agreements calls that
      # seed the suites' fixture agreements (DECISIONS.md §25.8) — that
      # seeding is why a port on the security-relevant listener is published
      # at all, since /health alone would not justify it. The TCK reaches this
      # listener too, for the initiate hooks, but by service name over the
      # Compose network rather than through this publish. Bound to 127.0.0.1,
      # never 0.0.0.0: this listener takes writes.
      - "127.0.0.1:8081:8081"

  tck:
    image: eclipsedataspacetck/dsp-tck-runtime@sha256:45cfafa40486714d441057bc6063653a1feebb95444f721974147cb0dd7416ad
    depends_on:
      - dsbox
    volumes:
      # The generated copy, not the tracked file: run.sh appends the minted
      # credential to it after the connector is up.
      - ./identities/config.properties:/etc/tck/config.properties:ro
