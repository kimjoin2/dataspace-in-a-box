# Configuration for the Eclipse DSP TCK running against dsbox.
# Property names follow config/tck/sample.tck.properties upstream.

dataspacetck.debug=true
dataspacetck.dsp.local.connector=false

# The TCK's own callback server. The connector reaches it by service name.
dataspacetck.port=8083
dataspacetck.callback.address=http://tck:8083

# The connector under test.
dataspacetck.dsp.connector.agent.id=urn:connector:dsbox-test
dataspacetck.dsp.connector.http.base.url=http://dsbox:8080
dataspacetck.dsp.connector.http.url=http://dsbox:8080/2025-1

# DspSystemLauncher.start() requires both of these unconditionally whenever
# dataspacetck.dsp.local.connector=false, regardless of which suites actually
# run — their absence throws before any suite (CN, CN_C, TP, TP_C) can start,
# which is why CN failed instantly alongside the unimplemented suites the
# first time this harness ran for real. They are where the TCK would POST to
# ask this connector to *initiate* a negotiation/transfer, i.e. the consumer
# negotiation role and the transfer process — neither exists yet (see
# README.md), so both paths 404 on this connector. That is fine: it only
# needs to unblock system startup for the CN suite this milestone gates;
# CN_C and TP/TP_C are expected to keep failing until their own milestones.
dataspacetck.dsp.connector.negotiation.initiate.url=http://dsbox:8080/2025-1/negotiations/initiate
dataspacetck.dsp.connector.transfer.initiate.url=http://dsbox:8080/2025-1/transfers/initiate

# How long to wait for the connector to respond to a DSP message, in
# SECONDS — DspSystemLauncher.start() reads this key with getPropertyAsLong
# and passes it straight into java.util.concurrent's SECONDS-unit await
# calls, unconverted (confirmed from the TCK's own source; its built-in
# fallback if this key is absent is 15). The previous value here, 10000,
# was carried over from the upstream sample.tck.properties, whose own
# default is 10000000 — but that file's value is 10,000,000 SECONDS
# (~115 days), so it was never a literal template to copy, and 10000
# SECONDS (2h46m) turned a genuinely-failing async push into a
# multi-hour wait per test instead of a fast, debuggable one.
dataspacetck.dsp.default.wait=20

# Dataset identifiers for the CAT suite.
#
# Key format: <TEST METHOD NAME UPPERCASED>_<FIELD NAME UPPERCASED>, resolved by
# the TCK's @ConfigParam injection from these properties first, then from a
# system property or environment variable. Without this note the names cannot be
# derived and the values look arbitrary.
#
# CAT_01_03_DATASETID is deliberately absent: an unset key makes the TCK
# generate a fresh random UUID per run, which is exactly what that test needs —
# an identifier the connector does not have.
CAT_01_01_DATASETID=urn:dataset:tck-catalog
CAT_01_02_DATASETID=urn:dataset:tck-request

# Dataset/offer identifiers for the CN suite (provider role).
#
# CN_02_02 is deliberately left with no override: it needs an entirely
# unadvertised identifier, which the TCK's own random default already is.
#
# CN_02_07 is deliberately left with no override too. It is a known,
# tracked gap — see docs/follow-ups.md — and its default random values are
# as good as any other for a test that is expected to fail.

# CN_01: happy path and the offer/agreement divergence rule.
CN_01_01_DATASETID=urn:dataset:cn-mismatch
CN_01_02_DATASETID=urn:dataset:cn-mismatch
CN_01_03_DATASETID=urn:dataset:cn-mismatch
CN_01_04_DATASETID=urn:dataset:cn-match
CN_01_04_OFFERID=urn:dataset:cn-match#offer

# CN_02: termination scenarios.
CN_02_01_DATASETID=urn:dataset:cn-expired
CN_02_01_OFFERID=urn:dataset:cn-expired#offer
CN_02_03_DATASETID=urn:dataset:cn-match
CN_02_03_OFFERID=urn:dataset:cn-match#offer
CN_02_04_DATASETID=urn:dataset:cn-mismatch
CN_02_05_DATASETID=urn:dataset:cn-expired
CN_02_06_DATASETID=urn:dataset:cn-expired

# CN_03: synchronous rejection scenarios. 03-01 needs a negotiation that can
# reach FINALIZED first, so it uses the matching pair; 03-02/03/04 only need
# to reach OFFERED, so they use the mismatched pair.
CN_03_01_DATASETID=urn:dataset:cn-match
CN_03_01_OFFERID=urn:dataset:cn-match#offer
CN_03_02_DATASETID=urn:dataset:cn-mismatch
CN_03_03_DATASETID=urn:dataset:cn-mismatch
CN_03_04_DATASETID=urn:dataset:cn-mismatch
