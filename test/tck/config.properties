# Configuration for the Eclipse DSP TCK running against dsbox.
# Property names follow config/tck/sample.tck.properties upstream.

dataspacetck.debug=true
dataspacetck.dsp.local.connector=false

# The TCK's own callback server. The connector reaches it by service name.
dataspacetck.port=8083
dataspacetck.callback.address=http://tck:8083

# The connector under test.
dataspacetck.dsp.connector.agent.id=urn:connector:dsbox-test
dataspacetck.dsp.connector.http.base.url=http://dsbox:8080
dataspacetck.dsp.connector.http.url=http://dsbox:8080/2025-1

# DspSystemLauncher.start() requires both of these unconditionally whenever
# dataspacetck.dsp.local.connector=false, regardless of which suites actually
# run — their absence throws before any suite (CN, CN_C, TP, TP_C) can start,
# which is why CN failed instantly alongside the unimplemented suites the
# first time this harness ran for real. They are where the TCK would POST to
# ask this connector to *initiate* a negotiation/transfer, i.e. the consumer
# negotiation role and the transfer process — neither exists yet (see
# README.md), so both paths 404 on this connector. That is fine: it only
# needs to unblock system startup for the CN suite this milestone gates;
# CN_C and TP/TP_C are expected to keep failing until their own milestones.
dataspacetck.dsp.connector.negotiation.initiate.url=http://dsbox:8080/2025-1/negotiations/initiate
dataspacetck.dsp.connector.transfer.initiate.url=http://dsbox:8080/2025-1/transfers/initiate

# How long to wait for the connector to respond to a DSP message, in
# SECONDS — DspSystemLauncher.start() reads this key with getPropertyAsLong
# and passes it straight into java.util.concurrent's SECONDS-unit await
# calls, unconverted (confirmed from the TCK's own source; its built-in
# fallback if this key is absent is 15). The previous value here, 10000,
# was carried over from the upstream sample.tck.properties, whose own
# default is 10000000 — but that file's value is 10,000,000 SECONDS
# (~115 days), so it was never a literal template to copy, and 10000
# SECONDS (2h46m) turned a genuinely-failing async push into a
# multi-hour wait per test instead of a fast, debuggable one.
dataspacetck.dsp.default.wait=20

# Dataset identifiers for the CAT suite.
#
# Key format: <TEST METHOD NAME UPPERCASED>_<FIELD NAME UPPERCASED>, resolved by
# the TCK's @ConfigParam injection from these properties first, then from a
# system property or environment variable. Without this note the names cannot be
# derived and the values look arbitrary.
#
# CAT_01_03_DATASETID is deliberately absent: an unset key makes the TCK
# generate a fresh random UUID per run, which is exactly what that test needs —
# an identifier the connector does not have.
CAT_01_01_DATASETID=urn:dataset:tck-catalog
CAT_01_02_DATASETID=urn:dataset:tck-request

# Dataset/offer identifiers for the CN suite (provider role).
#
# CN_02_02 is deliberately left with no override: it needs an entirely
# unadvertised identifier, which the TCK's own random default already is.
#
# CN_02_07 previously had no override on the same "expected to fail anyway"
# reasoning CN_02_02 states above — but that reasoning was never checked
# against a real run, and it was wrong: a random, unadvertised dataset id
# means decideInitialRequest returns outcomeNone and the negotiation never
# leaves REQUESTED, which fails CN_02_07 before it reaches the actual
# scenario the test names ("provider agreement, consumer verified, provider
# terminated"). The matching pair below gets it past that point, to
# whatever the real remaining question is — see docs/follow-ups.md.

# CN_01: happy path and the offer/agreement divergence rule.
CN_01_01_DATASETID=urn:dataset:cn-mismatch
CN_01_02_DATASETID=urn:dataset:cn-mismatch
CN_01_03_DATASETID=urn:dataset:cn-mismatch
CN_01_04_DATASETID=urn:dataset:cn-match
CN_01_04_OFFERID=urn:dataset:cn-match#offer

# CN_02: termination scenarios.
CN_02_01_DATASETID=urn:dataset:cn-expired
CN_02_01_OFFERID=urn:dataset:cn-expired#offer
CN_02_03_DATASETID=urn:dataset:cn-match
CN_02_03_OFFERID=urn:dataset:cn-match#offer
CN_02_04_DATASETID=urn:dataset:cn-mismatch
CN_02_05_DATASETID=urn:dataset:cn-expired
CN_02_06_DATASETID=urn:dataset:cn-expired
CN_02_07_DATASETID=urn:dataset:cn-match
CN_02_07_OFFERID=urn:dataset:cn-match#offer

# CN_03: synchronous rejection scenarios. 03-01 needs a negotiation that can
# reach FINALIZED first, so it uses the matching pair; 03-02/03/04 only need
# to reach OFFERED, so they use the mismatched pair.
CN_03_01_DATASETID=urn:dataset:cn-match
CN_03_01_OFFERID=urn:dataset:cn-match#offer
CN_03_02_DATASETID=urn:dataset:cn-mismatch
CN_03_03_DATASETID=urn:dataset:cn-mismatch
CN_03_04_DATASETID=urn:dataset:cn-mismatch

# CN_C: nine of sixteen tests use the default policy (accept/verify/wait)
# and need no override here — a random, unmatched datasetId already gets
# it. The other seven select one of five non-default fixtures configured
# in dsbox.yaml's consumer_policies. There is no CN_C_xx_yy_OFFERID key —
# unlike the provider suite, the consumer suite's @ConfigParam set has only
# datasetId; this connector always echoes back whatever offerId the TCK's
# own initiate call supplies.
CN_C_01_02_DATASETID=urn:dataset:cn-c-counter-offer
CN_C_01_03_DATASETID=urn:dataset:cn-c-reject-offer
CN_C_02_02_DATASETID=urn:dataset:cn-c-abandon
CN_C_02_03_DATASETID=urn:dataset:cn-c-reject-agreement
CN_C_02_04_DATASETID=urn:dataset:cn-c-passive-offer
CN_C_03_02_DATASETID=urn:dataset:cn-c-passive-offer
CN_C_03_03_DATASETID=urn:dataset:cn-c-passive-offer

# TP: the agreement each test cites. Every id here is imported through the
# management API by run.sh before the suite starts, and is also the selector
# for this connector's autonomous behavior (dsbox.yaml's transfer_policies) —
# the agreement id is the only test-varying field the provider suite puts on
# the wire.
#
# One key per test method, not one per class: the key is
# <TEST METHOD NAME UPPERCASED>_<FIELD NAME UPPERCASED> with no class-level or
# global fallback, so a method with no key of its own silently falls back to a
# fresh random UUID — @ConfigParam.required() defaults to false and the test
# class constructor pre-seeds agreementId. A blank value counts as absent for
# the same reason, so none of these may be left empty. That silent fallback is
# also what makes these keys observable: this connector rejects a transfer
# citing an agreement it has no record of, and a random UUID is never seeded.
#
# TP_02_04 is @Disabled upstream and produces no result. Its key is here
# anyway: it costs nothing and stops the list from looking like it has a hole.
TP_01_01_AGREEMENTID=urn:uuid:tck-tp-01-01
TP_01_02_AGREEMENTID=urn:uuid:tck-tp-01-02
TP_01_03_AGREEMENTID=urn:uuid:tck-tp-01-03
TP_01_04_AGREEMENTID=urn:uuid:tck-tp-01-04
TP_01_05_AGREEMENTID=urn:uuid:tck-tp-01-05
TP_02_01_AGREEMENTID=urn:uuid:tck-tp-default
TP_02_02_AGREEMENTID=urn:uuid:tck-tp-default
TP_02_03_AGREEMENTID=urn:uuid:tck-tp-default
TP_02_04_AGREEMENTID=urn:uuid:tck-tp-default
TP_02_05_AGREEMENTID=urn:uuid:tck-tp-nostart
TP_03_01_AGREEMENTID=urn:uuid:tck-tp-nostart
TP_03_02_AGREEMENTID=urn:uuid:tck-tp-nostart
TP_03_03_AGREEMENTID=urn:uuid:tck-tp-default
TP_03_04_AGREEMENTID=urn:uuid:tck-tp-default
TP_03_05_AGREEMENTID=urn:uuid:tck-tp-default
TP_03_06_AGREEMENTID=urn:uuid:tck-tp-default

# TP_C: the agreement each consumer-role test cites. Same key format as TP —
# <TEST METHOD NAME UPPERCASED>_<FIELD NAME UPPERCASED>, with no class-level
# or global fallback, so a method with no key of its own silently falls back
# to a fresh random UUID. That fallback is observable here for the same
# reason it is in TP: this connector refuses to start a transfer under an
# agreement it has no record of, and a random UUID is never seeded.
#
# Twelve of the sixteen share urn:uuid:tck-tpc-passive. Groups 01 and 03 need
# this connector to stay silent after its initial request, which is exactly
# what an agreement with no consumer_transfer_policies entry gets. Only the
# four consumer-driven tests need an id of their own.
#
# TP_C_02_04 is @Disabled upstream and produces no result. Its key is here
# anyway, so the list does not look like it has a hole.
TP_C_01_01_AGREEMENTID=urn:uuid:tck-tpc-passive
TP_C_01_02_AGREEMENTID=urn:uuid:tck-tpc-passive
TP_C_01_03_AGREEMENTID=urn:uuid:tck-tpc-passive
TP_C_01_04_AGREEMENTID=urn:uuid:tck-tpc-passive
TP_C_01_05_AGREEMENTID=urn:uuid:tck-tpc-passive
TP_C_02_01_AGREEMENTID=urn:uuid:tck-tpc-02-01
TP_C_02_02_AGREEMENTID=urn:uuid:tck-tpc-02-02
TP_C_02_03_AGREEMENTID=urn:uuid:tck-tpc-02-03
TP_C_02_04_AGREEMENTID=urn:uuid:tck-tpc-passive
TP_C_02_05_AGREEMENTID=urn:uuid:tck-tpc-02-05
TP_C_03_01_AGREEMENTID=urn:uuid:tck-tpc-passive
TP_C_03_02_AGREEMENTID=urn:uuid:tck-tpc-passive
TP_C_03_03_AGREEMENTID=urn:uuid:tck-tpc-passive
TP_C_03_04_AGREEMENTID=urn:uuid:tck-tpc-passive
TP_C_03_05_AGREEMENTID=urn:uuid:tck-tpc-passive
TP_C_03_06_AGREEMENTID=urn:uuid:tck-tpc-passive
