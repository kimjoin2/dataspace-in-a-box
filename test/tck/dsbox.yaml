# Connector configuration for the TCK harness only.
#
# public_url uses the Compose service name because the TCK addresses the
# connector by that name on the shared network. dev_mode permits plain http,
# which is the relaxation DECISIONS.md section 13 carves out for running
# without a reverse proxy.
public_url: http://dsbox:8080
dev_mode: true
dsp_addr: 0.0.0.0:8080

# Bound to all interfaces so the harness can poll readiness from the host.
# This is a test-only relaxation of the localhost default.
mgmt_addr: 0.0.0.0:8081

# The TCK harness imports its fixture agreements through the management API
# before the suite runs (see run.sh). Any value at least 16 characters works;
# this one is not a secret and never leaves the compose network.
mgmt_token: tck-harness-token-0

# Negotiation state lives here. The harness container gets a fresh one on
# every run: no compose volume is mounted for it, so it dies with the
# container. /home/nonroot is the one path in the distroless nonroot base
# image (see Dockerfile) that its uid 65532 process can create a subdirectory
# under; os.MkdirAll against /data itself fails with permission denied,
# since "/" is owned by root.
data_dir: /home/nonroot/data

# The participant and the datasets the CAT and CN suites ask for.
participant_id: urn:participant:dsbox-test
datasets:
  - id: urn:dataset:tck-catalog
  - id: urn:dataset:tck-request
  # CN: a plain, unrestricted dataset. Used wherever a test needs a
  # *recognized* dataset with a mismatched offer id (CN_01_01/02/03,
  # CN_02_02/04).
  - id: urn:dataset:cn-mismatch
  # CN: the dataset CN_01_04 requests, with its offer id matching exactly —
  # the immediate-AGREED path (CN_01_04, CN_02_03).
  - id: urn:dataset:cn-match
  # CN: otherwise identical to the two above, but already past its
  # validity_until — the expired-offer paths (CN_02_01, CN_02_05, CN_02_06).
  - id: urn:dataset:cn-expired
    validity_until: 2020-01-01T00:00:00Z
  # TP: the dataset every imported transfer agreement covers. The transfer
  # suites never ask for it by name — they cite an agreement, and run.sh's
  # seeding names this dataset on each one — but an agreement covering a
  # dataset this connector does not advertise would be a fixture that could
  # not have arisen from a real negotiation.
  - id: urn:dataset:tck-transfer

# CN_C: the consumer role's own autonomous reaction, keyed by the dataset_id
# this connector itself requests (see config.properties alongside this file and
# DECISIONS.md). Nine of the sixteen CN_C tests use the default policy
# (accept/verify/wait) and need no entry here.
consumer_policies:
  - dataset_id: urn:dataset:cn-c-counter-offer
    on_offer: counter
  - dataset_id: urn:dataset:cn-c-reject-offer
    on_offer: reject
  - dataset_id: urn:dataset:cn-c-abandon
    on_idle: abandon
  - dataset_id: urn:dataset:cn-c-reject-agreement
    on_agreement: reject
  - dataset_id: urn:dataset:cn-c-passive-offer
    on_offer: passive

# TP: what this connector does on its own after accepting a transfer request,
# keyed by the agreement it was requested under. The TCK sends one message and
# then only polls, so the agreement id is the only thing that can select a
# behavior — see the design spec's "Autonomous provider behavior".
#
# An agreement with no entry here gets [STARTED], which is what TP:02-01..04
# and TP:03-03..06 expect, so urn:uuid:tck-tp-default needs no entry. An
# explicit empty sequence means accept and stay in REQUESTED, which TP:02-05
# and TP:03-01/02 assert and which an unconditional start would break.
#
# Every agreement id named here, and urn:uuid:tck-tp-default, must also be
# seeded by run.sh: this connector rejects a transfer citing an agreement it
# has no record of.
transfer_policies:
  - agreement_id: urn:uuid:tck-tp-01-01
    sequence: [STARTED, TERMINATED]
  - agreement_id: urn:uuid:tck-tp-01-02
    sequence: [STARTED, COMPLETED]
  - agreement_id: urn:uuid:tck-tp-01-03
    sequence: [STARTED, SUSPENDED, TERMINATED]
  - agreement_id: urn:uuid:tck-tp-01-04
    sequence: [STARTED, SUSPENDED, STARTED, COMPLETED]
  - agreement_id: urn:uuid:tck-tp-01-05
    sequence: [TERMINATED]
  - agreement_id: urn:uuid:tck-tp-nostart
    sequence: []

# The consumer role's autonomous behavior. Only the four TP_C tests that
# require this connector to send a message of its own appear here; the other
# twelve share an agreement with no entry, which is what makes them passive.
consumer_transfer_policies:
  - agreement_id: urn:uuid:tck-tpc-02-01
    after: STARTED
    sequence: [TERMINATED]
  - agreement_id: urn:uuid:tck-tpc-02-02
    after: STARTED
    sequence: [COMPLETED]
  - agreement_id: urn:uuid:tck-tpc-02-03
    after: STARTED
    sequence: [SUSPENDED, TERMINATED]
  - agreement_id: urn:uuid:tck-tpc-02-05
    after: REQUESTED
    sequence: [TERMINATED]
