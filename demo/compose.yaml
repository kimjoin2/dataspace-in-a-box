# Two connectors with distinct identities and one shared roster. They reach
# each other by service name on this network, so nothing on the host has to
# reach a DSP port for the demo to work; run.sh drives both connectors
# through their management listeners alone.
services:
  provider:
    build:
      context: ..
      dockerfile: Dockerfile
    environment:
      # A fresh key every run (run.sh, generated/ is gitignored), so it
      # cannot live in the tracked *.yaml the way the file paths do.
      - DSBOX_ROSTER_SIGNER=${DSBOX_ROSTER_SIGNER}
    volumes:
      - ./provider.yaml:/etc/dsbox/config.yaml:ro
      - ./generated/provider.key:/etc/dsbox/participant.key:ro
      - ./generated/roster.json:/etc/dsbox/roster.json:ro
      - ./generated/sample.csv:/etc/dsbox/data/sample.csv:ro
      - ./generated/sample-resume.csv:/etc/dsbox/data/sample-resume.csv:ro
    ports:
      # The management listener is published because that is where run.sh
      # drives a connector from — on this one only the readiness probe, since
      # the exchange is driven from the consumer's side. The image is
      # distroless — no shell, no wget — so there is no driving it from
      # inside.
      #
      # The DSP listener is published as well, and nothing in run.sh reaches
      # it: the connectors address each other by service name. It stays open
      # so a reader can look at the protocol surface by hand — the version
      # endpoint, a catalog request — while the demo runs.
      - "127.0.0.1:9180:8080"
      - "127.0.0.1:9181:8081"

  consumer:
    build:
      context: ..
      dockerfile: Dockerfile
    depends_on:
      - provider
    environment:
      - DSBOX_ROSTER_SIGNER=${DSBOX_ROSTER_SIGNER}
    volumes:
      - ./consumer.yaml:/etc/dsbox/config.yaml:ro
      - ./generated/consumer.key:/etc/dsbox/participant.key:ro
      - ./generated/roster.json:/etc/dsbox/roster.json:ro
      # The whole data directory, not just downloads: mounting a
      # subdirectory makes Docker create the parent as root, and the image
      # runs as nonroot, which then cannot write its own database there.
      - ./generated/consumer-data:/home/nonroot/data
    ports:
      - "127.0.0.1:9280:8080"
      - "127.0.0.1:9281:8081"
