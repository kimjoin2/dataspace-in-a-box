# The provider: advertises two datasets, and has a file behind each.
public_url: http://provider:8080
dev_mode: true
participant_id: urn:participant:provider
participant_key: /etc/dsbox/participant.key
roster: /etc/dsbox/roster.json
# roster_signer is not set here: it is a fresh key every run, so run.sh
# passes it through compose.yaml's environment (DSBOX_ROSTER_SIGNER).
dsp_addr: 0.0.0.0:8080
mgmt_addr: 0.0.0.0:8081
mgmt_token: demo-management-token
# The image runs as nonroot, whose only writable home is here.
data_dir: /home/nonroot/data

datasets:
  - id: urn:dataset:sample
    source_file: /etc/dsbox/data/sample.csv
  - id: urn:dataset:sample-resume
    source_file: /etc/dsbox/data/sample-resume.csv
    simulate_interrupt_after_bytes: 2000
    transfer_sequence: [STARTED, SUSPENDED, STARTED, COMPLETED]

# No transfer_policies entry, so this agreement gets the default [STARTED]:
# accept the request and start. That is the configuration that serves data —
# a sequence naming COMPLETED would end the transfer, and with it the access,
# before the consumer could fetch anything.
