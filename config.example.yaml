# The connector's external address, as seen by other participants.
# Required. Behind a reverse proxy the connector cannot determine this itself,
# so it is never inferred from request headers. No trailing slash.
public_url: https://connector.example.org

# Permit a plain http public_url. Only for local demos and the TCK harness,
# which run without a reverse proxy.
dev_mode: false

# Listen address for public DSP endpoints.
dsp_addr: 0.0.0.0:8080

# Listen address for the management API. Localhost by default: exposing it is
# a deliberate act, not an accident.
mgmt_addr: 127.0.0.1:8081

# The single bearer token the management API accepts. Optional. With no token
# configured the management API refuses every authenticated request — absent
# never means "no auth required". Minimum 16 characters.
# DSBOX_MGMT_TOKEN overrides it.
mgmt_token: ""

# Where the connector's SQLite database file lives, at {data_dir}/dsbox.db.
# Required. Created on first start if it does not exist.
data_dir: ./data

# How long a data transfer may go without progress before it is given up on,
# on both sides: the provider rolls its response write deadline by this, and
# a consumer's pull cancels when no bytes arrive within it. Optional,
# default 60s. DSBOX_DATA_IDLE_TIMEOUT overrides it.
#
# This bounds time without progress, not total time. That distinction is the
# whole point: a bound on total time is a file size limit expressed in
# seconds, and it moves with the network rather than with any decision an
# operator made.
# data_idle_timeout: 60s

# The ceiling on a single data pull, in bytes. Optional, default 8589934592
# (8 GiB). DSBOX_MAX_DOWNLOAD_BYTES overrides it.
#
# This caps every pull, whatever the counterparty states. A response
# declaring a Content-Length larger than this is cut at the ceiling exactly
# like a chunked one, so a dataset bigger than this value does not transfer
# until you raise it — set it against the largest dataset you intend to
# serve, not against a worst case you never expect to reach.
#
# Two things it is uniquely: the only bound at all when a counterparty
# states no length, and the only backstop against a transfer that never
# goes idle because it dribbles.
# max_download_bytes: 8589934592

# This participant's identifier, as it appears in every catalog this connector
# serves and as the issuer of every credential it presents. Required and never
# inferred. DSBOX_PARTICIPANT_ID overrides it.
participant_id: urn:participant:example

# This connector's Ed25519 private key, in PEM. It signs the credential
# presented to every counterparty (DECISIONS.md section 10). Required unless
# require_auth is false. Generate one with:
#
#     dsops keygen -out /etc/dsbox/participant.key
#
# DSBOX_PARTICIPANT_KEY overrides it.
participant_key: /etc/dsbox/participant.key

# The participant roster: whose signatures this connector accepts
# (DECISIONS.md section 9). Required unless require_auth is false. A JSON
# document mapping participant identifiers to base64url Ed25519 public keys,
# signed by roster_signer below:
#
#     {"participants": [{"id": "urn:participant:peer", "public_key": "..."}],
#      "signature": "..."}
#
# Build a participant's public_key with `dsops keygen` (theirs) or
# `dsops resolve <did:web:...>` (a counterparty's, resolved rather than
# copied by hand). Sign the finished file with `dsops roster sign`.
#
# Read once at startup, so adding or removing a participant means editing
# this file, re-signing it, and restarting. An unusable roster — including
# one with no signature, or one whose signature does not verify — is a
# startup failure rather than a warning: a connector that cannot verify
# anyone should say so at boot, not by refusing every request later.
#
# The signature is what lets this file be distributed over a channel less
# trusted than the disk it ends up on; without it, the roster is trusted
# exactly as far as this config file is, the same as roster_signer's own
# distribution problem below.
#
# DSBOX_ROSTER overrides it.
roster: /etc/dsbox/roster.json

# The operator's Ed25519 public key (base64url) — what roster's own
# "signature" field must verify against. Not a participant's key: the
# roster is the registry itself, and signing it with an entry's own key
# would let that entry vouch for itself. Required unless require_auth is
# false. Generate the signing key with `dsops keygen`, same as any other key
# in this project.
#
# This is the one piece section 9 leaves unsolved rather than moves:
# roster_signer's own distribution to every connector that must trust the
# same roster is still an out-of-band problem, the same one config.yaml
# itself already has.
#
# DSBOX_ROSTER_SIGNER overrides it. The value below is an example, not a
# real key — nothing verifies against it until an operator generates their
# own and points every connector sharing this roster at the same public half.
roster_signer: 11qYAYKxCrfVS_7TyWQHOg7hcvPapiMlrwIaaPcHURo

# Turn connector-to-connector authentication off. Defaults to true (on), and
# false is permitted only alongside dev_mode: true — a connector that has not
# been declared a development instance may not accept unauthenticated
# counterparties. It exists for migration, not convenience: switching a
# running connector from anonymous to authenticated is otherwise a flag day
# for every counterparty at once.
# require_auth: true

# The datasets this connector advertises. Optional: with none configured, the
# catalog is served without a dataset key at all.
#
# Each id must be an absolute IRI and must survive as a single URL path segment,
# because the dataset endpoint routes on it directly — no /, ?, # or whitespace.
# A urn: name satisfies both. The connector synthesizes the offer, the
# distribution, and the data service around each id. There is no general
# policy syntax here — DECISIONS.md section 14 evaluates exactly two policy
# shapes, unrestricted use and validity_until below, and nothing else can be
# expressed through this file.
#
# There is no environment override for this list.
datasets:
  - id: urn:dataset:sample
    # The file this dataset's bytes come from. This is the field that makes
    # the connector actually serve data, and it is the one most likely to be
    # missed: a dataset without it is still advertisable, negotiable, and
    # transferable — the whole control plane works — and only the data
    # endpoint answers 409, because the agreement is real and there is
    # nothing configured behind it.
    #
    # Checked for existence at startup, so a typo fails at boot rather than
    # on the first pull. Read per request rather than held open: a file
    # swapped underneath the connector is the operator's business.
    #
    # Note what transfer_policies does to this. Its default, [STARTED], is
    # the configuration that serves data; a sequence naming COMPLETED or
    # TERMINATED ends the transfer on a timer, and ending a transfer ends
    # access to its bytes. A terminal step and a source_file do not combine.
    # source_file: /var/lib/dsbox/sample.csv

    # Optional. RFC 3339. Absent means the offer never expires. Set, this
    # becomes a real ODRL constraint on the offer and the agreement — not
    # only a negotiation-time gate — and the data plane refuses a pull once
    # the window closes, even for a transfer already STARTED. Uncomment to
    # try it:
    # validity_until: 2027-01-01T00:00:00Z

    # Optional. Not a policy shape — DSP 2025-1 itself leaves the choice
    # between VERIFIED -> FINALIZED and VERIFIED -> TERMINATED to the
    # provider, with no request-side signal to decide by, so it has to be
    # declared here rather than derived. false (default, and every dataset's
    # behavior before this field existed): finalize once the consumer
    # verifies the agreement. true: terminate instead. A real deployment has
    # no reason to advertise a dataset whose agreements always terminate —
    # this exists for exercising the transition, the same role
    # transfer_policies plays for the transfer protocol.
    # terminate_on_verify: false

    # Optional. Keyed by this dataset, not by an agreement — the fallback
    # for when no transfer_policies entry below names the specific
    # agreement, because a negotiated agreement's id does not exist until
    # the negotiation that produces it is already under way and so cannot
    # be written into this file ahead of time (DECISIONS.md section 25.7).
    # Same rules as transfer_policies' own sequence: an agreement_id match
    # there always wins over this; an explicit empty list here means accept
    # and stay in REQUESTED, a different thing from leaving this commented
    # out. Uncomment to try it:
    # transfer_sequence: [STARTED, SUSPENDED, STARTED, COMPLETED]

    # Optional. Not a policy shape either — a demo/test affordance that
    # truncates a non-Range pull at this many bytes and severs the
    # connection, so make demo can prove resumption against a real
    # interrupted transfer. A request carrying Range is never truncated. A
    # real deployment has no reason to set this.
    #
    # The response still declares the file's full Content-Length, so a
    # client sees an unexpected EOF rather than a short but well-formed
    # body — which is what a real interruption looks like.
    #
    # Uncomment to try it:
    # simulate_interrupt_after_bytes: 2000

# Optional. Configures this connector's autonomous behavior when it is
# negotiating as consumer (POST /negotiations/initiate), keyed by the
# dataset_id it itself requests. An unmatched dataset_id gets every field's
# default: accept an offer, verify an agreement, wait indefinitely if
# nothing arrives. Uncomment to try a non-default policy:
# consumer_policies:
#   - dataset_id: urn:dataset:example
#     on_offer: accept        # accept (default) | passive | reject | counter
#     on_agreement: verify    # verify (default) | reject
#     on_idle: wait           # wait (default) | abandon

# Optional. Configures this connector's autonomous behavior as transfer
# provider, keyed by the agreement a transfer is requested under. The sequence
# is the states it walks on its own after accepting the request, pushing the
# matching message to the consumer's callback address at each step.
#
# An agreement with no entry here gets [STARTED]: accept, then start. An
# explicit empty sequence means accept and stay in REQUESTED — a different
# thing from having no entry, which is why it has to be written out.
#
# An entry always overrides that default, whether or not it carries a sequence
# key: omitting the key is read as an empty sequence, not as "use the
# default", because a list cannot distinguish absent from empty. To get the
# default behavior for an agreement, remove its entry.
#
# Valid states: STARTED, SUSPENDED, COMPLETED, TERMINATED. REQUESTED is not
# one of them: it is the state a transfer starts in, not one it can be driven
# to. There is no environment override for this list.
#
# The walk has to be legal, too, and that part is not checked at load: whether
# a step is allowed depends on where the previous one left the transfer, which
# is only known at runtime. [COMPLETED] (completing something never started),
# [STARTED, STARTED], and [TERMINATED, STARTED] all load without complaint and
# are then refused at the illegal step, which ends the sequence and logs
# "refuse illegal configured transfer step". The legal moves are the protocol's
# own: start from REQUESTED or SUSPENDED; complete or suspend only from
# STARTED; terminate from anything not already terminal.
# transfer_policies:
#   - agreement_id: urn:uuid:example-agreement
#     sequence: [STARTED, SUSPENDED, STARTED, COMPLETED]
#   - agreement_id: urn:uuid:another-agreement
#     sequence: []            # accept the request and stay in REQUESTED

# Optional. The mirror of transfer_policies for the consumer role: what this
# connector does on its own once a transfer it requested reaches a state,
# keyed by the agreement the transfer runs under. Unlike the provider table
# above, an agreement with no entry here sends nothing at all — the consumer
# has no default sequence to fall back on.
#
# `after` is the state whose arrival releases the sequence; empty means
# STARTED. The same rule about legality applies: whether a step is allowed
# depends on where the previous one left the transfer, which is only known at
# runtime, so an illegal walk loads without complaint and is refused at the
# step. There is no environment override for this list.
# consumer_transfer_policies:
#   - agreement_id: urn:uuid:example-agreement
#     after: STARTED
#     sequence: [COMPLETED]
